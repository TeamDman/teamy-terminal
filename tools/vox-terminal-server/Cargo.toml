[package]
name = "teamy-terminal-vox-server"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
eyre = "0.6.12"
teamy-terminal-cli = { path = "../../crates/teamy-terminal-cli", default-features = false }
tokio = { version = "1.49.0", features = ["full"] }

# Cargo patches are workspace-root scoped; mirror the main workspace's CSV
# source bridge so this separate prototype uses identical Facet/format types.
[patch."https://github.com/TeamDman/facet-format.git"]
teamy-facet-format = { version = "=0.50.0-rc.9" }
teamy-facet = { version = "=0.50.0-rc.7" }
teamy-facet-core = { version = "=0.50.0-rc.7" }
teamy-facet-reflect = { version = "=0.50.0-rc.7" }
