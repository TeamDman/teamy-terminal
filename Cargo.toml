[workspace]
resolver = "3"
members = [
    "crates/teamy-terminal-core",
    "crates/teamy-terminal-control",
    "crates/teamy-terminal-font",
    "crates/teamy-terminal-frame",
    "crates/teamy-terminal-pty",
    "crates/teamy-terminal-renderer",
    "crates/teamy-terminal-cli",
]
default-members = ["crates/teamy-terminal-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/TeamDman/teamy-terminal"
keywords = ["terminal", "vulkan", "cli"]
categories = ["command-line-utilities"]

[workspace.metadata.teamy-terminal]
description = "Portable terminal core and Vulkan renderer"
documentation = "https://github.com/TeamDman/teamy-terminal"

[workspace.dependencies]
teamy-terminal-core = { path = "crates/teamy-terminal-core" }
teamy-terminal-control = { path = "crates/teamy-terminal-control" }
teamy-terminal-font = { path = "crates/teamy-terminal-font" }
teamy-terminal-frame = { path = "crates/teamy-terminal-frame" }
teamy-terminal-pty = { path = "crates/teamy-terminal-pty" }
teamy-terminal-renderer = { path = "crates/teamy-terminal-renderer" }

arbitrary = { version = "1.4.1", features = ["derive"] }
chrono = "0.4"
color-eyre = "0.6.5"
eyre = "0.6.12"
humantime = "2.3.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
    "registry",
] }
tracing-tracy = { version = "0.11", default-features = false, features = [
    "enable",
    "system-tracing",
    "context-switch-tracing",
    "sampling",
    "code-transfer",
    "callstack-inlines",
    "only-localhost",
] }
tokio = { version = "1.49.0", features = ["full"] }
teamy-cancellation = { git = "https://github.com/TeamDman/teamy-cancellation.git", rev = "7c77848", features = ["arbitrary"] }

# Keep every Facet/Figue/Vox package on the same reviewed and published
# TeamDman/facet presentation-contract revision.
facet = { git = "https://github.com/TeamDman/facet.git", rev = "95da1ade547956643d48bf96fb6821e350063f57", package = "facet", features = ["uuid", "compact_str", "chrono", "net"] }
facet-csv = { git = "https://github.com/TeamDman/facet.git", rev = "95da1ade547956643d48bf96fb6821e350063f57", package = "facet-csv" }
facet-json = { git = "https://github.com/TeamDman/facet.git", rev = "95da1ade547956643d48bf96fb6821e350063f57", package = "facet-json" }
facet-pretty = { git = "https://github.com/TeamDman/facet.git", rev = "95da1ade547956643d48bf96fb6821e350063f57", package = "facet-pretty" }
figue = { git = "https://github.com/TeamDman/facet.git", rev = "95da1ade547956643d48bf96fb6821e350063f57", package = "figue", features = ["arbitrary"] }
spec-proto = { git = "https://github.com/TeamDman/facet.git", rev = "95da1ade547956643d48bf96fb6821e350063f57", package = "spec-proto" }
vox-terminal = { git = "https://github.com/TeamDman/facet.git", rev = "95da1ade547956643d48bf96fb6821e350063f57", package = "vox", default-features = false, features = ["runtime", "transport-tcp"] }

embed-resource = "3.0.6"
portable-pty = "0.9"
vte = "0.14"
unicode-width = "0.2"
num-traits = "0.2"
fontdue = "0.9.3"
fontdb = "0.23"
swash = "0.2.10"
ttf-parser = "0.25"
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
arboard = "3"
png = "0.18.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
unfulfilled_lint_expectations = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

multiple_crate_versions = "allow"
multiple_unsafe_ops_per_block = "deny"
module_inception = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "allow"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
